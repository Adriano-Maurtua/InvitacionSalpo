<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Un Viaje a Salpo</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Open+Sans:wght@300;400&display=swap" rel="stylesheet">
    
    <style>
        body, html {
            height: 100%;
            margin: 0;
            overflow: hidden; /* Evita el scroll cuando el botón huya */
            font-family: 'Open Sans', sans-serif;
            background-color: #111;
        }

        /* Tipografía elegante */
        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(4rem, 10vw, 7rem);
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }
        p.lead {
            font-weight: 300;
            text-shadow: 1px 1px 5px rgba(0,0,0,0.8);
            font-size: clamp(1.1rem, 4vw, 1.3rem);
        }

        /* Animación de fondo con tus imágenes */
        .bg-slideshow {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }
        .bg-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            animation: fadeSlide 18s infinite;
        }
        /* Capa oscura para que el texto resalte */
        .bg-layer::after {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
        }

        /* Asignación de tus imágenes locales */
        .bg-1 { background-image: url('nubes.jpeg'); animation-delay: 0s; }
        .bg-2 { background-image: url('cascada.jpeg'); animation-delay: 6s; }
        .bg-3 { background-image: url('piedra.jpeg'); animation-delay: 12s; }

        @keyframes fadeSlide {
            0% { opacity: 0; transform: scale(1); }
            10% { opacity: 1; }
            33% { opacity: 1; }
            43% { opacity: 0; transform: scale(1.05); }
            100% { opacity: 0; }
        }

        /* Botones personalizados */
        .btn-custom {
            border-radius: 50px;
            padding: 12px 35px;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-yes {
            background-color: #fdfaf4;
            color: #111;
            border: 2px solid #fdfaf4;
            z-index: 10;
        }
        .btn-yes:hover {
            background-color: #e5dacd;
            border-color: #e5dacd;
        }
        
        /* BOTÓN NOP - NUEVO DISEÑO */
        .btn-no {
            background-color: #dc3545; /* Color rojo */
            color: #ffffff; /* Letras blancas */
            border: 2px solid #dc3545;
            z-index: 10;
        }
        
        /* Contenedor que mantiene el espacio del botón 'Nop' intacto */
        .btn-no-wrapper {
            width: 130px; 
            height: 50px;
            display: inline-block;
        }

        /* El modal de Bootstrap modificado */
        .modal-content {
            background-color: #1a1a1a;
            color: #fdfaf4;
            border: 1px solid #444;
            border-radius: 15px;
        }
        .modal-header, .modal-footer {
            border: none;
        }
    </style>
</head>
<body class="text-white">

    <!-- Fondo dinámico -->
    <div class="bg-slideshow">
        <div class="bg-layer bg-1"></div>
        <div class="bg-layer bg-2"></div>
        <div class="bg-layer bg-3"></div>
    </div>

    <!-- Contenido principal -->
    <main class="position-relative z-2 vh-100 d-flex flex-column justify-content-center align-items-center text-center px-3">
        
        <h1 class="mb-3">Salpo</h1>
        <p class="lead mb-5 mx-auto" style="max-width: 600px;">
            Acompáñame a tocar el cielo. Nos espera un colchón de nubes, paisajes increíbles y un viaje inolvidable. ¿Aceptas la invitación?
        </p>

        <!-- Contenedor de Botones -->
        <div class="d-flex justify-content-center align-items-center gap-3 flex-wrap">
            <button class="btn btn-custom btn-yes" data-bs-toggle="modal" data-bs-target="#successModal">¡Obvio sí!</button>
            
            <div class="btn-no-wrapper">
                <button class="btn btn-custom btn-no" id="btnNo">Nop</button>
            </div>
        </div>
    </main>

    <!-- Modal de Éxito -->
    <div class="modal fade" id="successModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content p-4 text-center">
                <div class="modal-header justify-content-center pb-0">
                    <h2 class="modal-title fs-2" style="font-family: 'Cormorant Garamond', serif; color: #e5dacd;">¡Es un hecho! 🎒</h2>
                </div>
                <div class="modal-body">
                    <p class="mb-0 fs-5">Prepara una buena casaca y tus ganas de aventura. Nos vamos al balcón del cielo.</p>
                </div>
                <div class="modal-footer justify-content-center pt-0">
                    <button type="button" class="btn btn-custom btn-yes mt-3" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        const btnNo = document.getElementById('btnNo');
        let scale = 1; // Tamaño inicial

        const moveAndShrink = (e) => {
            e.preventDefault(); // Evita que se haga zoom accidental o doble tap en celulares
            
            // Restamos un 15% del tamaño actual en cada click
            scale -= 0.15;
            
            // Si llega a ser muy pequeño (ej. 0 o negativo), lo mantenemos en 0
            if (scale < 0) scale = 0;

            btnNo.style.position = 'fixed';
            
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;
            
            // Calculamos posiciones aleatorias asegurándonos de que no se salga de la pantalla
            const randomX = Math.floor(Math.random() * (windowWidth - 100));
            const randomY = Math.floor(Math.random() * (windowHeight - 50));
            
            btnNo.style.left = `${randomX}px`;
            btnNo.style.top = `${randomY}px`;
            
            // Aplicamos la reducción de tamaño y la transición al mismo tiempo
            btnNo.style.transform = `scale(${scale})`;
            btnNo.style.transition = 'left 0.25s ease, top 0.25s ease, transform 0.25s ease';
        };

        // Escuchamos el evento 'click' (para PC) y 'touchstart' (para móviles)
        btnNo.addEventListener('click', moveAndShrink);
        btnNo.addEventListener('touchstart', moveAndShrink, { passive: false });
    </script>
</body>
</html>
